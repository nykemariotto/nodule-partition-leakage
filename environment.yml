# Conda alternative to requirements.txt (env name `nodules`). It installs the data, analysis and
# plotting stack; the training stack (torch cu121 / timm) is installed from the CUDA wheel index as
# described in requirements.txt. Both files pin the same versions.
name: nodules
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy==1.23.5
      - scipy==1.15.3
      - pandas==2.3.3
      - pydicom==2.4.5
      - pylidc==0.2.3
      - SQLAlchemy==1.4.54
      - scikit-image==0.21.0
      - Pillow==12.3.0
      - matplotlib==3.10.9
      - PyYAML==6.0.3
      - "setuptools<80"
      - scikit-learn==1.3.2
