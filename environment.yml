# Conda alternative to requirements.txt (STAGE 1-3 stack; env name `nodules`).
# Training deps (torch cu121 / timm) are added at STAGE 4 — see requirements.txt.
name: nodules
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy==1.23.5
      - scipy==1.15.3
      - pandas==2.3.3
      - pydicom==2.4.5
      - pylidc==0.2.3
      - SQLAlchemy==1.4.54
      - scikit-image==0.21.0
      - Pillow==12.3.0
      - matplotlib==3.10.9
      - PyYAML==6.0.3
      - "setuptools<80"
      # 1.3.2, NOT 1.7.2: this file pinned 1.7.2 while requirements.txt pinned 1.3.2 and recorded
      # 1.7.2 in its own header as a defect already corrected there. 1.3.2 is what is installed and
      # what produced everything under outputs/. Two declared environments that disagree are worse
      # than one, in a repository whose claim is that the results recompute.
      - scikit-learn==1.3.2
      # Needed by scripts/build_response_docx.py and scripts/build_highlighted.py, which build the
      # submission documents. Neither produces a scientific result, but both are tracked here and
      # were unrunnable from the declared environment until 2026-08-05.
      - python-docx==1.2.0
      - pymupdf==1.28.0
